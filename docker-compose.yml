# ============================================================
# Docker Compose - Lokale Entwicklung & Produktion
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
      - PORT=5173
      - DATABASE_URL=file:/app/storage/database/quiz.db
      - STORAGE_ROOT=/app/storage
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
      - PUBLIC_APP_URL=http://localhost:5173
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    volumes:
      - quiz-data:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  quiz-data:
    driver: local
