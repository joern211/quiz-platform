# ============================================================
# Docker Compose - Lokale Entwicklung & Produktion
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/app/storage/database/quiz.db
      - STORAGE_ROOT=/app/storage
      - SESSION_SECRET=${SESSION_SECRET:-quiz-platform-prod-secret-32chars-min}
      - PUBLIC_APP_URL=http://localhost:3001
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change-me-in-production}
      - WEB_DIST_PATH=/app/web
    volumes:
      - quiz-data:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  quiz-data:
    driver: local
