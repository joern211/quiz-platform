<!DOCTYPE html>
<html lang="de" data-theme="dark" data-accent="lila">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#11101b">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Online Quiz Plattform — Spiele mit Freunden in Echtzeit">

  <title>QuizPlattform — Spiele mit Freunden</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='10' fill='%2311101b'/><text x='20' y='28' text-anchor='middle' font-family='system-ui,sans-serif' font-size='22' font-weight='800' fill='%23e1b0f4'>q</text></svg>">

  <!-- Persönliche Darstellung vor dem ersten Rendern anwenden (kein falsches Theme beim Laden).
       Muss zu packages/ui/src/providers/appearance.ts passen (Schlüssel, Version, erlaubte Werte). -->
  <script>
    (function () {
      var theme = 'dark', accent = 'lila';
      var accents = ['lila', 'blau', 'tuerkis', 'gruen', 'orange', 'rosa'];
      try {
        var legacy = localStorage.getItem('quiz-theme');
        if (legacy === 'dark' || legacy === 'light') theme = legacy;
        var raw = localStorage.getItem('quiz-appearance');
        if (raw) {
          var v = JSON.parse(raw);
          if (v && v.v === 1) {
            if (v.theme === 'dark' || v.theme === 'light') theme = v.theme;
            if (accents.indexOf(v.accent) !== -1) accent = v.accent;
          }
        }
      } catch (e) { /* Speicher blockiert oder defekt: Standard */ }
      var root = document.documentElement;
      root.setAttribute('data-theme', theme);
      root.setAttribute('data-accent', accent);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#faf5fc' : '#11101b');
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
