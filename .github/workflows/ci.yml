name: CI

on:
  push:
    branches: [main, gate-1-build-db]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Run database migrations
        env:
          DATABASE_URL: file:/tmp/quiz-server-test.db
        run: pnpm prisma migrate deploy --schema=./prisma/schema.prisma

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Server tests
        env:
          DATABASE_URL: file:/tmp/quiz-server-test.db
          SESSION_SECRET: ci-test-secret-at-least-32-chars-long
        run: pnpm --filter @quiz/server test

      - name: Web tests
        run: pnpm --filter @quiz/web test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Install Playwright browsers
        run: pnpm --filter @quiz/web exec playwright install --with-deps chromium

      - name: Build all apps
        run: pnpm build

      - name: Create fresh SQLite DB and run migrations + seed
        env:
          DATABASE_URL: file:/tmp/test-e2e.db
          SESSION_SECRET: test-secret-32chars-long-for-e2e
        run: |
          rm -f /tmp/test-e2e.db
          DATABASE_URL=file:/tmp/test-e2e.db pnpm prisma migrate deploy
          DATABASE_URL=file:/tmp/test-e2e.db SESSION_SECRET=test-secret-32chars-long-for-e2e pnpm db:seed

      - name: Run E2E tests (Geo G4-* and Jeopardy J1-J10)
        env:
          E2E_BASE_URL: http://localhost:5173
          DATABASE_URL: file:/tmp/test-e2e.db
          SESSION_SECRET: test-secret-32chars-long-for-e2e
          CI: 'true'
        run: |
          pnpm exec playwright test \
            --config=playwright.config.ts \
            --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-report
          path: playwright-report/
          retention-days: 2

      - name: Upload test-results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 2
