name: CI

on:
  push:
    branches: [main, gate-1-build-db]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Run database migrations
        env:
          DATABASE_URL: file:/tmp/quiz-server-test.db
        run: pnpm prisma migrate deploy --schema=./prisma/schema.prisma

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Server tests
        env:
          DATABASE_URL: file:/tmp/quiz-server-test.db
          SESSION_SECRET: ci-test-secret-at-least-32-chars-long
        run: pnpm --filter @quiz/server test

      - name: Web tests
        run: pnpm --filter @quiz/web test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Install Playwright browsers
        run: pnpm --filter @quiz/web exec playwright install --with-deps chromium

      - name: Build all apps
        run: pnpm build

      - name: Create fresh SQLite DB and run migrations + seed
        env:
          DATABASE_URL: file:/tmp/test-e2e.db
          SESSION_SECRET: test-secret-32chars-long-for-e2e
        run: |
          rm -f /tmp/test-e2e.db
          DATABASE_URL=file:/tmp/test-e2e.db pnpm prisma migrate deploy
          DATABASE_URL=file:/tmp/test-e2e.db SESSION_SECRET=test-secret-32chars-long-for-e2e pnpm db:seed

      - name: Start backend server (port 3001) in background
        run: |
          DATABASE_URL=file:/tmp/test-e2e.db \
          SESSION_SECRET=test-secret-32chars-long-for-e2e \
          ALLOWED_ORIGINS=http://localhost:3001,http://localhost:5173 \
          PUBLIC_APP_URL=http://localhost:3001 \
          NODE_ENV=development \
          node apps/server/dist/server.js &
          echo "BACKEND_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 60); do
            if curl -s http://localhost:3001/api/v1/health > /dev/null 2>&1; then
              echo "Backend server ready"
              break
            fi
            if [ $i -eq 60 ]; then echo "Backend failed to start"; exit 1; fi
            sleep 1
          done

      - name: Run E2E tests
        env:
          E2E_BASE_URL: http://localhost:5173
          PLAYWRIGHT_REPORT_DIR: playwright-report
        run: |
          DIAG_FILE=/tmp/e2e-diag.log
          TEST_OUT=/tmp/e2e-test-out.log

          echo "=== E2E DIAGNOSTIC ===" > $DIAG_FILE
          echo "NODE=$(node --version)" >> $DIAG_FILE
          echo "PLAYWRIGHT_BIN=$(ls apps/web/node_modules/.bin/playwright 2>/dev/null || echo NOT_FOUND)" >> $DIAG_FILE
          echo "PW_MODULE=$(node -e "require.resolve('@playwright/test')" 2>&1)" >> $DIAG_FILE

          echo "=== RUNNING G4 E2E TESTS ===" >> $DIAG_FILE

          # Run tests, capture exit code, tee to file
          set -o pipefail
          pnpm test:e2e -- --project=chromium --grep="G4-" 2>&1 | tee $TEST_OUT
          EXIT=${PIPESTATUS[0]}

          echo "=== TEST EXIT CODE: $EXIT ===" >> $DIAG_FILE

          # Append test output to GITHUB_OUTPUT (each line as key=value)
          # Long multi-line output: write separately
          {
            echo "E2E_EXIT=$EXIT"
            echo "E2E_DIAG<<EOF"
            cat $DIAG_FILE
            echo "EOF"
          } >> $GITHUB_OUTPUT

          {
            echo "E2E_OUT<<EOF"
            cat $TEST_OUT
            echo "EOF"
          } >> $GITHUB_OUTPUT

          ls playwright-report/ >> $DIAG_FILE 2>&1 || true
          ls test-results/ >> $DIAG_FILE 2>&1 || true

          # Always print diagnostic so it shows in step output
          cat $DIAG_FILE

          exit $EXIT

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-report
          path: playwright-report/
          retention-days: 2

      - name: Upload test-results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 2
